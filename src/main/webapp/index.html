<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="registration-card">

        <div class="header">
            <div class="icon">👤</div>

            <h1>User Registration</h1>

            <p>Enter your details to register</p>
        </div>

        <!-- Success message -->
        <div id="successMessage" class="success-message">
            User registered successfully!
        </div>

        <form id="userForm" action="register" method="post">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    User Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="50"
                        required
                >

                <small id="nameError" class="error"></small>

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                        id="gender"
                        name="gender"
                        required
                >

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <small id="genderError" class="error"></small>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                >

                <small id="emailError" class="error"></small>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                        type="submit"
                        id="submitButton"
                        class="submit-btn"
                >
                    Save User
                </button>

                <button
                        type="button"
                        id="refreshButton"
                        class="refresh-btn"
                >
                    ↻ Clear
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    const form = document.getElementById("userForm");

    const nameInput = document.getElementById("name");
    const genderInput = document.getElementById("gender");
    const emailInput = document.getElementById("email");

    const nameError = document.getElementById("nameError");
    const genderError = document.getElementById("genderError");
    const emailError = document.getElementById("emailError");

    const submitButton = document.getElementById("submitButton");

    const refreshButton = document.getElementById("refreshButton");

    const successMessage = document.getElementById("successMessage");


    // Hide success message initially
    successMessage.style.display = "none";


    // Show success message after redirect
    const params = new URLSearchParams(window.location.search);

    if (params.get("success") === "1") {

        successMessage.style.display = "block";

    }


    // Name validation
    function validateName() {

        const name = nameInput.value.trim();

        const namePattern = /^[A-Za-z ]+$/;

        if (name === "") {

            nameError.textContent = "Name is required.";
            return false;

        }

        if (name.length < 2) {

            nameError.textContent = "Name must contain at least 2 characters.";
            return false;

        }

        if (!namePattern.test(name)) {

            nameError.textContent =
                "Name can contain only letters and spaces.";

            return false;

        }

        nameError.textContent = "";

        return true;
    }


    // Gender validation
    function validateGender() {

        if (genderInput.value === "") {

            genderError.textContent = "Please select your gender.";

            return false;
        }

        genderError.textContent = "";

        return true;
    }


    // Email validation
    function validateEmail() {

        const email = emailInput.value.trim();

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {

            emailError.textContent =
                "Email is required.";

            return false;
        }

        if (!emailPattern.test(email)) {

            emailError.textContent =
                "Please enter a valid email address.";

            return false;
        }

        emailError.textContent = "";

        return true;
    }


    // Validate while typing
    nameInput.addEventListener("input", validateName);

    genderInput.addEventListener("change", validateGender);

    emailInput.addEventListener("input", validateEmail);


    // Form submit
    form.addEventListener("submit", function(event) {

        const validName = validateName();

        const validGender = validateGender();

        const validEmail = validateEmail();


        if (!validName || !validGender || !validEmail) {

            event.preventDefault();

            return;
        }


        // Prevent double clicking
        submitButton.disabled = true;

        submitButton.textContent = "Saving...";

    });


    // Clear / Refresh button
    refreshButton.addEventListener("click", function() {

        form.reset();

        nameError.textContent = "";

        genderError.textContent = "";

        emailError.textContent = "";

        successMessage.style.display = "none";

        nameInput.focus();

        // Remove ?success=1 from URL
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    });

</script>

</body>

</html>
