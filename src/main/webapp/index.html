<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>User Management System</h1>

        <p class="subtitle">
            Register a new user
        </p>

        <!-- Success Message -->
        <div id="successMessage"
             class="success-message">

            User registered successfully!

        </div>

        <form id="userForm"
              action="register"
              method="post">

            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="50"
                        required
                >

                <small id="nameError"
                       class="error">
                </small>

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                        id="gender"
                        name="gender"
                        required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <small id="genderError"
                       class="error">
                </small>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        maxlength="100"
                        required
                >

                <small id="emailError"
                       class="error">
                </small>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                        type="submit"
                        id="saveButton"
                        class="save-button">

                    Save User

                </button>

                <button
                        type="button"
                        id="clearButton"
                        class="clear-button">

                    Clear

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    const form =
        document.getElementById("userForm");

    const nameInput =
        document.getElementById("name");

    const genderInput =
        document.getElementById("gender");

    const emailInput =
        document.getElementById("email");

    const saveButton =
        document.getElementById("saveButton");

    const clearButton =
        document.getElementById("clearButton");


    // -----------------------------
    // FORM VALIDATION
    // -----------------------------

    form.addEventListener("submit", function(event) {

        let valid = true;

        const name =
            nameInput.value.trim();

        const gender =
            genderInput.value;

        const email =
            emailInput.value.trim();


        // Clear previous errors

        document.getElementById("nameError")
            .textContent = "";

        document.getElementById("genderError")
            .textContent = "";

        document.getElementById("emailError")
            .textContent = "";


        // Name validation

        const namePattern =
            /^[A-Za-z ]+$/;

        if (name.length < 2) {

            document.getElementById("nameError")
                .textContent =
                "Name must contain at least 2 characters.";

            valid = false;

        } else if (!namePattern.test(name)) {

            document.getElementById("nameError")
                .textContent =
                "Name can contain only letters and spaces.";

            valid = false;
        }


        // Gender validation

        if (gender === "") {

            document.getElementById("genderError")
                .textContent =
                "Please select gender.";

            valid = false;
        }


        // Email validation

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            document.getElementById("emailError")
                .textContent =
                "Please enter a valid email.";

            valid = false;
        }


        // Stop form if invalid

        if (!valid) {

            event.preventDefault();

            return;
        }


        // Prevent double-click / duplicate submission

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";

    });


    // -----------------------------
    // CLEAR BUTTON
    // -----------------------------

    clearButton.addEventListener(
        "click",
        function() {

            form.reset();

            document.getElementById("nameError")
                .textContent = "";

            document.getElementById("genderError")
                .textContent = "";

            document.getElementById("emailError")
                .textContent = "";

            saveButton.disabled = false;

            saveButton.textContent =
                "Save User";
        }
    );


    // -----------------------------
    // SUCCESS MESSAGE
    // -----------------------------

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    if (
        urlParams.get("success") === "1"
    ) {

        document.getElementById(
            "successMessage"
        ).style.display = "block";
    }

</script>

</body>

</html>
